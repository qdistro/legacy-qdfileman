name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Qt offscreen platform deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install qfileman with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install linters
        run: pip install ruff
      - name: Compile all Python files
        run: python -m compileall -q qfileman/ tests/
      - name: Ruff
        run: ruff check qfileman/ tests/
